<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Halaman HTML no-store (vercel.json): Vercel menjawab 304 TANPA header CSP, jadi
         browser menahan CSP lama selama isi berkas ini tak berubah. 24 Sep 2026. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#062036" />
    <title>Nuara Dashboard</title>
    <meta name="description" content="Aplikasi internal Nuara Service: tiket servis, kasir, stok, kas, dan absensi." />
    <!-- Alat internal workshop: tidak ada halaman yang boleh diindeks. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA: installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nuara" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Font self-hosted (@font-face di src/styles/global.css). Font teks dan
         judul di-preload; JetBrains Mono menunggu CSS. -->
    <link rel="preload" href="/fonts/inter-v20-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-v22-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="max-width: 32rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif">
        Nuara Dashboard butuh JavaScript. Aktifkan JavaScript di browser lalu muat ulang halaman ini.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
